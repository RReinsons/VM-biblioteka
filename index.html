<!doctype html>
<html lang="lv" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Valodu Mājas valodu apguves un mācīšanas grāmatu katalogs">
  <title>Valodu Mājas bibliotēka</title>
  <link rel="icon" type="image/png" href="assets/favicon.png?v=20260812-1">
  <link rel="stylesheet" href="styles.css?v=20260812-7">
</head>
<body>
  <a class="skip-link" href="#catalog">Pāriet uz katalogu</a>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Valodu Māja"><img src="assets/logo.png" alt="Valodu Māja"></a>
    <nav aria-label="Galvenā navigācija"><a class="active" href="#catalog" data-i18n="books">Grāmatas</a><a href="#about" data-i18n="about">Par bibliotēku</a></nav>
    <div class="header-tools">
      <button id="fontDown" class="text-button" aria-label="Samazināt teksta izmēru">A−</button>
      <button id="fontUp" class="text-button" aria-label="Palielināt teksta izmēru">A+</button>
      <button id="themeToggle" class="icon-button" aria-label="Mainīt krāsu režīmu">☼</button>
      <button id="langToggle" class="text-button" aria-label="Change language">LV / EN</button>
    </div>
  </header>

  <main>
    <section id="catalog" aria-labelledby="catalogTitle">
      <h1 id="catalogTitle" class="sr-only">Grāmatu katalogs</h1>
      <form id="searchForm" class="search-row" role="search">
        <label class="sr-only" for="query">Meklēt katalogā</label>
        <input id="query" type="search" autocomplete="off" placeholder="Meklēt pēc nosaukuma, autora, tēmas, atslēgvārda…">
        <button class="primary" type="submit" data-i18n="search">Meklēt</button>
      </form>

      <button id="filtersToggle" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filters" data-i18n="showFilters">Rādīt filtrus</button>
      <div id="filters" class="filters" aria-label="Kataloga filtri"></div>
      <div class="filter-summary">
        <div id="activeFilters" class="active-filters" aria-live="polite"></div>
        <button id="resetFilters" class="secondary-button" type="button" data-i18n="resetFilters">Atiestatīt visus filtrus</button>
      </div>

      <div class="catalog-toolbar">
        <p class="pin-note"><span class="pin-note-icon" aria-hidden="true"></span> <span data-i18n="pinNote">Piespraustās grāmatas tiek rādītas vispirms.</span> <button id="clearPins" class="link-button" data-i18n="clearPins">Notīrīt piesprausto</button></p>
        <div class="view-tools">
          <label for="sort" data-i18n="sortBy">Kārtot pēc:</label>
          <select id="sort"><option value="newest">Jaunākie vispirms</option><option value="oldest">Vecākie vispirms</option><option value="title">Nosaukums A–Z</option><option value="author">Autors A–Z</option></select>
          <label for="pageSize" data-i18n="perPage">Grāmatas lapā:</label>
          <select id="pageSize" class="page-size"><option value="12">12</option><option value="24">24</option><option value="48">48</option></select>
          <div class="segmented" aria-label="Skata veids"><button id="gridView" aria-label="Režģa skats">▦</button><button id="listView" aria-label="Saraksta skats">☷</button></div>
        </div>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="results"></div>
      <nav id="pagination" class="pagination" aria-label="Lapas"></nav>
    </section>

    <section id="about" class="about-section" aria-labelledby="aboutTitle">
      <h2 id="aboutTitle" data-i18n="about">Par bibliotēku</h2>
      <p data-i18n="aboutText"></p>
    </section>
  </main>

  <script src="config.js?v=20260812-1"></script>
  <script src="sample-data.js?v=20260812-1"></script>
  <script src="app.js?v=20260812-3"></script>
</body>
</html>
